services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    ports:
      - "${POSTGRES_PORT_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}",
      ]
    ports:
      - "${REDIS_PORT_BIND:-127.0.0.1:6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_API_KEY:?MEILISEARCH_API_KEY must be set}
      MEILI_ENV: ${MEILI_ENV:-production}
    ports:
      - "${MEILISEARCH_PORT_BIND:-127.0.0.1:7700}:7700"
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:7700/health | grep -q available",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      RATE_LIMIT_SINGLE: 300/minute
      RATE_LIMIT_BATCH: 60/minute
      CORS_ALLOWED_ORIGINS: https://lolobuyspreadsheets.com,https://www.lolobuyspreadsheets.com,https://api.lolobuyspreadsheets.com
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
    ports:
      - "${EMBEDDING_SERVICE_PORT_BIND:-127.0.0.1:8001}:8001"
    volumes:
      - ${HF_CACHE_HOST_PATH:-/opt/lolobuyspreadsheets/data/hf-cache}:/root/.cache/huggingface
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import json,sys,urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8001/health', timeout=5)).get('status') == 'ok' else 1)\"",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - /opt/lolobuyspreadsheets/env/api.env
    ports:
      - "${API_PUBLIC_PORT_BIND:-127.0.0.1:4101}:4101"
    volumes:
      - ${UPLOADS_HOST_PATH:-/opt/lolobuyspreadsheets/data/uploads}:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:$${PORT:-4101}/health || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
