limit_req_zone $binary_remote_addr zone=indexfinds_web_rate:10m rate=12r/s;
limit_req_zone $binary_remote_addr zone=indexfinds_dynamic_rate:10m rate=4r/s;
limit_conn_zone $binary_remote_addr zone=indexfinds_connections:10m;

map $http_user_agent $indexfinds_meta_crawler_key {
    default "";
    ~*meta-externalagent indexfinds-meta-crawler;
    ~*SemrushBot indexfinds-semrush-crawler;
}
limit_req_zone $indexfinds_meta_crawler_key zone=indexfinds_meta_crawler_rate:10m rate=1r/s;

# The observed distributed crawler rotates through OVH VPS addresses, so a
# per-address limit is not sufficient. Group only the affected hosting ranges;
# normal residential visitors continue to use the regular per-IP limits.
geo $indexfinds_hosting_crawler_key {
    default "";
    51.38.0.0/16 indexfinds-ovh-crawler;
    51.75.0.0/16 indexfinds-ovh-crawler;
    51.195.0.0/16 indexfinds-ovh-crawler;
    141.94.0.0/16 indexfinds-ovh-crawler;
    141.95.0.0/16 indexfinds-ovh-crawler;
    147.135.0.0/16 indexfinds-ovh-crawler;
    151.80.0.0/16 indexfinds-ovh-crawler;
    213.32.0.0/16 indexfinds-ovh-crawler;
    2001:41d0::/32 indexfinds-ovh-crawler;
}
limit_req_zone $indexfinds_hosting_crawler_key zone=indexfinds_hosting_crawler_rate:10m rate=2r/s;

server {
    listen 80;
    listen [::]:80;
    server_name indexfinds.com www.indexfinds.com;

    return 301 https://indexfinds.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.indexfinds.com;

    ssl_certificate /root/.indexfinds-migration/certificates/cert-prep-20260810T121957Z/cloudflare-origin/indexfinds.com/origin.fullchain.pem;
    ssl_certificate_key /root/.indexfinds-migration/certificates/cert-prep-20260810T121957Z/cloudflare-origin/indexfinds.com/origin.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://indexfinds.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name indexfinds.com;

    ssl_certificate /root/.indexfinds-migration/certificates/cert-prep-20260810T121957Z/cloudflare-origin/indexfinds.com/origin.fullchain.pem;
    ssl_certificate_key /root/.indexfinds-migration/certificates/cert-prep-20260810T121957Z/cloudflare-origin/indexfinds.com/origin.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /www/wwwlogs/indexfinds.com.log;
    error_log /www/wwwlogs/indexfinds.com.error.log;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 25m;
    limit_req_status 429;
    limit_conn_status 429;

    add_header Strict-Transport-Security "max-age=31536000" always;

    if ($http_user_agent ~* "Lightpanda/1\.0") {
        return 403;
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /_next/image {
        limit_req zone=indexfinds_meta_crawler_rate burst=8 nodelay;
        limit_req zone=indexfinds_hosting_crawler_rate burst=16 nodelay;
        limit_req zone=indexfinds_dynamic_rate burst=12 nodelay;
        limit_conn indexfinds_connections 12;
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }

    location ~ "^/(?:api/|[a-z]{2}/(?:search|products/))" {
        limit_req zone=indexfinds_meta_crawler_rate burst=8 nodelay;
        limit_req zone=indexfinds_hosting_crawler_rate burst=16 nodelay;
        limit_req zone=indexfinds_dynamic_rate burst=24 nodelay;
        limit_conn indexfinds_connections 20;
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }

    location / {
        limit_req zone=indexfinds_meta_crawler_rate burst=8 nodelay;
        limit_req zone=indexfinds_hosting_crawler_rate burst=16 nodelay;
        limit_req zone=indexfinds_web_rate burst=80 nodelay;
        limit_conn indexfinds_connections 30;
        proxy_pass http://127.0.0.1:3102;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
}
