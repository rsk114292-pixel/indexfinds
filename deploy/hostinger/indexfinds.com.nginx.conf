server {
    listen 80;
    listen [::]:80;
    server_name indexfinds.com www.indexfinds.com;

    return 301 https://indexfinds.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.indexfinds.com;

    ssl_certificate /root/.indexfinds-migration/certificates/cert-prep-20260810T121957Z/cloudflare-origin/indexfinds.com/origin.fullchain.pem;
    ssl_certificate_key /root/.indexfinds-migration/certificates/cert-prep-20260810T121957Z/cloudflare-origin/indexfinds.com/origin.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://indexfinds.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name indexfinds.com;

    ssl_certificate /root/.indexfinds-migration/certificates/cert-prep-20260810T121957Z/cloudflare-origin/indexfinds.com/origin.fullchain.pem;
    ssl_certificate_key /root/.indexfinds-migration/certificates/cert-prep-20260810T121957Z/cloudflare-origin/indexfinds.com/origin.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /www/wwwlogs/indexfinds.com.log;
    error_log /www/wwwlogs/indexfinds.com.error.log;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 25m;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
}
