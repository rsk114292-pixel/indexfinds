        <rect width="632" height="222" rx="22" fill="#fff" stroke="#edbfd0"/>
        <text x="26" y="43" fill="#9e2857" font-size="18">CURRENT ORDER STAGE</text>
        <g transform="translate(35 83)" text-anchor="middle" font-size="14">
          <path d="M53 30H505" stroke="#edbfd0" stroke-width="4"/>
