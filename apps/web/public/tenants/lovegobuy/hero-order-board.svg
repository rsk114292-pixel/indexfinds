          <g transform="translate(204 30)"><circle r="26" fill="#fbe5ee" stroke="#d94678"/><text y="5" fill="#9e2857">2</text><text y="62" fill="#5d3d4b">ORDER</text></g>
          <g transform="translate(355 30)"><circle r="26" fill="#fbe5ee" stroke="#d94678"/><text y="5" fill="#9e2857">3</text><text y="62" fill="#5d3d4b">WAREHOUSE</text></g>
          <g transform="translate(505 30)"><circle r="26" fill="#fbe5ee" stroke="#d94678"/><text y="5" fill="#9e2857">4</text><text y="62" fill="#5d3d4b">SERVICE</text></g>
        </g>
