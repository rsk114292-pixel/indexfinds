<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">LoveGoBuy product and order board</title>
  <desc id="desc">A pink order board separating product discovery, source checks, order status and service actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c101a"/>
      <stop offset="0.58" stop-color="#351329"/>
      <stop offset="1" stop-color="#6f1944"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb4ce"/>
      <stop offset="1" stop-color="#d94678"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b0509" flood-opacity=".48"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1330" cy="150" r="240" fill="#ffb4ce" opacity=".08"/>
  <g transform="translate(770 115)" filter="url(#shadow)">
    <rect width="700" height="660" rx="34" fill="#fff8fb"/>
    <rect x="34" y="34" width="632" height="86" rx="20" fill="#fbe5ee"/>
    <circle cx="78" cy="77" r="18" fill="#d94678"/>
    <rect x="116" y="59" width="228" height="15" rx="7" fill="#351329" opacity=".82"/>
    <rect x="116" y="84" width="318" height="10" rx="5" fill="#6f5663" opacity=".58"/>
    <g font-family="Arial, sans-serif" font-weight="700">
      <g transform="translate(34 158)">
        <rect width="300" height="196" rx="22" fill="#fff" stroke="#edbfd0"/>
        <text x="26" y="43" fill="#9e2857" font-size="18">01 PRODUCT GROUP</text>
        <path d="M35 89h78v66H35zM52 89v-15h44v15" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linejoin="round"/>
        <rect x="142" y="82" width="126" height="13" rx="6" fill="#351329" opacity=".8"/>
        <rect x="142" y="108" width="96" height="10" rx="5" fill="#8d7380" opacity=".55"/>
        <rect x="142" y="130" width="112" height="10" rx="5" fill="#8d7380" opacity=".4"/>
      </g>
      <g transform="translate(366 158)">
        <rect width="300" height="196" rx="22" fill="#fff" stroke="#edbfd0"/>
        <text x="26" y="43" fill="#9e2857" font-size="18">02 SOURCE CHECK</text>
        <circle cx="79" cy="116" r="42" fill="#fbe5ee"/>
        <path d="M58 116l14 14 29-34" fill="none" stroke="#d94678" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="142" y="82" width="126" height="13" rx="6" fill="#351329" opacity=".8"/>
        <rect x="142" y="108" width="96" height="10" rx="5" fill="#8d7380" opacity=".55"/>
        <rect x="142" y="130" width="112" height="10" rx="5" fill="#8d7380" opacity=".4"/>
      </g>
