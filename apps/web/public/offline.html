<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
      background: #FAFAFA;
      color: #2D2D2D;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      border-radius: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #2D2D2D;
    }
    p {
      font-size: 16px;
      color: #6B7280;
      margin-bottom: 32px;
      max-width: 320px;
      line-height: 1.5;
    }
    .retry-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 32px;
      background: #FF6B47;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .retry-btn:hover { background: #E5553A; }
    .retry-btn:active { background: #CC4A30; }
    .offline-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <img src="/icons/icon-192x192.png" alt="Site Logo" class="icon">
  <div class="offline-icon">📡</div>
  <h1>You're Offline</h1>
  <p>It looks like you've lost your internet connection. Please check your network and try again.</p>
  <button class="retry-btn" onclick="window.location.reload()">
    ↻ Try Again
  </button>
</body>
</html>
